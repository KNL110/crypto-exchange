env: "dev"
dbPath: <DATABASE_URL> # for local: "postgresql://<username>:<password>@localhost:5432/<DatabaseName>"
httpServer:
    address: "0.0.0.0"
    port: 8080
ganacheServer:
    address: "localhost"
    port: 8545
    privateKey: <PRIVATE_KEY>
logLevel: "info"  # debug, info, warn, error
logPretty: false  # true for readable console logs while developing
walPath: "./data/wal.log" # write-ahead log; replayed on startup to rebuild the order books
# walHmacKey: set WAL_HMAC_KEY in the environment instead (openssl rand -hex 32)
